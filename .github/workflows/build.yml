name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The list rules, scheduling and the day rolling over. Linux machines are quick to get.
  rules:
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Test the list rules
        run: swift test

  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Test the list rules
        run: swift test

      - name: Build the app
        run: ./scripts/build-app.sh

      - name: Zip the app
        run: cd build && ditto -c -k --keepParent "3 Today.app" "3-Today.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: 3-Today-app
          path: build/3-Today.zip
